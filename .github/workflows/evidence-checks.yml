name: Evidence checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: read

jobs:
  evidence-checks:
    name: Extraction and review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install workflow dependencies
        run: python -m pip install 'pymupdf==1.27.2.3' 'pillow==12.2.0' 'requests==2.34.2' 'numpy==2.4.6'
      - name: Fetch published CIAT history for the pinned replay tests
        run: |
          git clone --bare --single-branch --branch main --no-tags https://github.com/CIAT/nbs_ruralscan.git "$RUNNER_TEMP/ciat-history.git"
          echo "CIAT_TEST_REPO=$RUNNER_TEMP/ciat-history.git" >> "$GITHUB_ENV"
      - name: Check discovery and acquisition inputs
        run: |
          python -m unittest discover -v -s workflows/discovery
          python -m unittest discover -v -s workflows/acquisition
      - name: Check extraction, provenance and retry
        run: python -m unittest discover -v -s workflows/extraction
      - name: Check CSV and dashboard consensus
        run: python -m unittest discover -v -s workflows/review_preview
      - name: Check published decisions and provisional ratings
        run: python -m unittest discover -v -s workflows/review_status
      - name: Check authenticated submission handling
        run: python -m unittest discover -v -s workflows/submissions
      - name: Verify official registers and reproduce the queue
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # Compare with the branch as it stood before this change. A pull request merged as
          # several commits must not be compared with its own earlier commits. Without a usable
          # earlier commit the script falls back to the parent of the head commit.
          args=()
          if [[ -n "$PR_BASE" ]]; then
            args+=(--base "$PR_BASE")
          elif git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            args+=(--base "$PUSH_BEFORE")
          fi
          python workflows/submissions/check_registers.py --ciat-repo "$CIAT_TEST_REPO" "${args[@]}"
