<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Submit evidence review · RuralScan</title><link rel="stylesheet" href="/desk.css"><script defer src="/desk.js"></script></head><body>
<main><header><strong>RuralScan</strong><span id="account">Connecting…</span></header>
<h1>Submit evidence review</h1><p id="mode"></p>
<form id="vote"><label for="lane">Queue</label><select id="lane"><option value="T4">T4 · Suitability</option><option value="T3/T6">T3 / T6 · Hazard and scorecard</option></select>
<label for="eid">Finding ID</label><input id="eid" required autocomplete="off"><a id="source" hidden>Inspect finding and source</a><p id="quote"></p>
<label for="decision">Decision</label><select id="decision" required><option value="">Choose a decision</option><option value="approve">Keep</option><option value="hold">Hold for clarification</option><option value="reject">Drop</option></select>
<label for="reason">Reason code</label><select id="reason"><option value="">Choose if needed</option></select>
<label for="note">Review note</label><textarea id="note" rows="2"></textarea>
<button type="submit">Submit review</button></form>
<details><summary>Submit a review CSV</summary><p>Use the queue selected above. The reviewer in each row must match your signed-in account.</p><label for="file">Evidence review CSV</label><input id="file" type="file" accept=".csv,text/csv"><button id="upload" type="button">Submit CSV</button></details>
<p id="status" role="status" aria-live="polite"></p>
<section><h2>My reviewed</h2><button id="history" type="button">Show my submissions</button><ul id="receipts"></ul></section></main></body></html>
